<style>
:root{
  --fond:#15171c; --panneau:#1c1f26; --panneau2:#232731; --bord:#2e3340; --texte:#d7dae0;
  --doux:#8a91a0; --accent:#e0a84f; --accent2:#6cb0ff; --ok:#7cc48a; --err:#ff7b72; --sel:#2b3242;
  --mono: ui-monospace,"JetBrains Mono","Cascadia Code","SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--fond);color:var(--texte);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;background:var(--panneau2);border:1px solid var(--bord);border-radius:6px;padding:.3rem .65rem;cursor:pointer}
button:hover{border-color:var(--accent);color:#fff}
button.primaire{background:var(--accent);color:#1b1b1b;border-color:var(--accent);font-weight:600}
button.primaire:hover{filter:brightness(1.08);color:#000}
button:disabled{opacity:.4;cursor:default}
#app{display:grid;grid-template-rows:48px 1fr 150px;grid-template-columns:270px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:.6rem;padding:0 .9rem;background:var(--panneau);border-bottom:1px solid var(--bord)}
.logo{font-family:var(--mono);font-weight:700;letter-spacing:.02em;color:var(--accent);margin-right:.6rem}
.logo span{color:var(--doux);font-weight:400}
#fil{font-family:var(--mono);color:var(--doux);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#fil b{color:var(--texte);font-weight:500}
aside{background:var(--panneau);border-right:1px solid var(--bord);overflow:auto;padding:.4rem 0}
.racine{margin-bottom:.4rem}
.racine-titre{display:flex;align-items:center;gap:.3rem;padding:.35rem .7rem;font-size:.75rem;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
.racine-titre .nom{flex:1;font-weight:600}
.racine-titre button,.ligne button{padding:0 .35rem;font-size:.8rem;line-height:1.5;border-color:transparent;background:transparent;color:var(--doux)}
.racine-titre button:hover,.ligne button:hover{border-color:var(--bord);color:var(--texte)}
.ligne{display:flex;align-items:center;gap:.35rem;padding:.15rem .6rem;cursor:pointer;white-space:nowrap;font-family:var(--mono);font-size:.84rem}
.ligne:hover{background:var(--panneau2)}
.ligne.actif{background:var(--sel);box-shadow:inset 2px 0 var(--accent)}
.ligne .nom{flex:1;overflow:hidden;text-overflow:ellipsis}
.ligne .actions{display:none}
.ligne:hover .actions{display:flex}
.ico{width:1.1em;text-align:center;color:var(--doux);flex:none}
.ico.prg{color:var(--accent)} .ico.page{color:var(--accent2)} .ico.dossier{color:#c9a96e}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
#onglets{display:flex;background:var(--panneau);border-bottom:1px solid var(--bord);overflow-x:auto;min-height:36px}
.onglet{display:flex;align-items:center;gap:.4rem;padding:0 .4rem 0 .8rem;border-right:1px solid var(--bord);cursor:pointer;font-family:var(--mono);font-size:.82rem;color:var(--doux);white-space:nowrap}
.onglet.actif{background:var(--fond);color:var(--texte);box-shadow:inset 0 2px var(--accent)}
.onglet .fermer{border:0;background:none;padding:0 .3rem;color:var(--doux)}
.onglet.sale .fermer::before{content:"●";color:var(--accent)}
.onglet.sale .fermer span{display:none}
#zone{flex:1;position:relative;min-height:0}
#zone>*{position:absolute;inset:0}
.CodeMirror{height:100%;font-family:var(--mono);font-size:14px;line-height:1.55;background:var(--fond);color:var(--texte)}
.CodeMirror-gutters{background:var(--fond);border-right:1px solid var(--bord)}
.CodeMirror-linenumber{color:#4c5466}
.CodeMirror-cursor{border-left:2px solid var(--accent)}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected{background:#2d3a52!important}
.CodeMirror-activeline-background{background:#1b1e25}
.CodeMirror-matchingbracket{color:#fff!important;outline:1px solid var(--accent)}
.cm-s-wdg .cm-keyword{color:#e0a84f;font-weight:600}
.cm-s-wdg .cm-def{color:#ffd28a}
.cm-s-wdg .cm-builtin{color:#6cb0ff}
.cm-s-wdg .cm-string{color:#a5d6a7}
.cm-s-wdg .cm-number{color:#f2a17a}
.cm-s-wdg .cm-atom{color:#d59fff}
.cm-s-wdg .cm-comment{color:#6b7385;font-style:italic}
.cm-s-wdg .cm-operator{color:#9aa4b5}
.cm-s-wdg .cm-variable-2{color:#7fd6d6}
.cm-s-wdg .cm-variable-3{color:#ff9bb7}
.cm-s-wdg .cm-tag{color:#6cb0ff}
.cm-s-wdg .cm-attribute{color:#e8c37e}
.cm-s-wdg .cm-tag-wdg{color:#000;background:var(--accent);border-radius:3px}
.cm-s-wdg .cm-property{color:#c3cbd6}
.cm-s-wdg .cm-variable,.cm-s-wdg .cm-qualifier{color:#d7dae0}
.cm-s-wdg .cm-bracket,.cm-s-wdg .cm-meta{color:#9aa4b5}
.cm-s-wdg .cm-link{color:#6cb0ff}
.cm-s-wdg .cm-header{color:#e0a84f;font-weight:600}
.ligne-erreur{background:rgba(255,123,114,.13)}
.CodeMirror-dialog{background:var(--panneau2);color:var(--texte);border-color:var(--bord)!important}
.CodeMirror-dialog input{color:var(--texte);font-family:var(--mono)}
textarea.repli{width:100%;height:100%;resize:none;border:0;outline:0;padding:1rem;background:var(--fond);color:var(--texte);font:14px/1.55 var(--mono);tab-size:2}
#accueil{display:grid;place-items:center;color:var(--doux);text-align:center;padding:2rem}
#accueil h2{color:var(--texte);font-weight:600;margin:.2rem 0 1rem}
#accueil kbd{font-family:var(--mono);background:var(--panneau2);border:1px solid var(--bord);border-radius:4px;padding:0 .35rem;color:var(--texte)}
#apercu{display:grid;place-items:center;overflow:auto;background:repeating-conic-gradient(#1d2027 0 25%,#191b21 0 50%) 0 0/20px 20px}
#apercu img{max-width:90%;max-height:90%;box-shadow:0 10px 40px #0008}
#apercu .info{color:var(--doux);font-family:var(--mono)}
footer{grid-column:1/3;background:var(--panneau);border-top:1px solid var(--bord);display:flex;flex-direction:column;min-height:0}
.console-titre{display:flex;align-items:center;gap:.6rem;padding:.3rem .9rem;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--doux);border-bottom:1px solid var(--bord)}
.console-titre .etat{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--mono)}
#console{flex:1;overflow:auto;font-family:var(--mono);font-size:.83rem;padding:.3rem 0}
#console div{padding:.1rem .9rem}
#console .err{color:var(--err);cursor:pointer}
#console .err:hover{background:var(--panneau2)}
#console .ok{color:var(--ok)}
#console .info{color:var(--doux)}
#fichierTel{display:none}
@media (max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:48px 220px 1fr 120px}header{grid-column:1}footer{grid-column:1}aside{border-right:0;border-bottom:1px solid var(--bord)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">wdGestion&nbsp;V<span>/FR · éditeur</span></div>
    <div id="fil">Aucun fichier ouvert</div>
    <button id="btRecharger" title="Recompiler toutes les procédures de PROG">⟳ Recharger PROG</button>
    <button id="btEnregistrer" class="primaire" disabled title="Ctrl+S">Enregistrer</button>
  </header>
  <aside id="arbre"></aside>
  <main>
    <div id="onglets"></div>
    <div id="zone">
      <div id="accueil"><div>
        <h2>Éditeur wdGestion V</h2>
        <p>Ouvrez un fichier dans <b>PROG</b>, <b>PAGE</b> ou <b>BLOB</b>.</p>
        <p><kbd>Ctrl</kbd>+<kbd>S</kbd> enregistrer · <kbd>Ctrl</kbd>+<kbd>F</kbd> rechercher · <kbd>Alt</kbd>+<kbd>G</kbd> aller à la ligne · <kbd>Ctrl</kbd>+<kbd>/</kbd> commenter</p>
        <p>Les procédures sont recompilées à chaque enregistrement d'un fichier de PROG.</p>
      </div></div>
    </div>
  </main>
  <footer>
    <div class="console-titre">Console <span class="etat" id="etat"></span></div>
    <div id="console"></div>
  </footer>
</div>
<input type="file" id="fichierTel" multiple>
<script>
"use strict";
const $ = s => document.querySelector(s);
const CM = window.CodeMirror;
const etat = { racines: [], onglets: [], actif: null, ouverts: new Set(["BLOB", "PAGE", "PROG"]), dossierTel: null };
// CC BY-NC-SA 4.0 - jean-marc "jihem" quere 2026
// langage wdGestion V/FR
const MOTS = "procedure fonction finprocedure finfonction si sinon sinonsi finsi tantque fintantque pour chaque dans a jusqua pas suivant finpour sortir boucler faire cas autrement fincas parametres locale local globale retourner retour stocker envoyer inclure avec rediriger statut entete nouvelle table supprimer inserer retirer de du position clef cle fixermetatable sql utiliser alias ordre filtre selectionner fermer tout aller haut bas debut fin sauter ajouter vide remplacer par effacer localiser continuer chercher parcourir finparcourir compter deconnecter liberer erreur essayer capturer finessayer rafraichir comme et ou non";
const FONCS = "majuscule minuscule rogner rognerg rognerd longueur souschaine gauche droite position chaine texte valeur nombre espace repliquer remplacertexte contient commencepar finitpar decouper joindre html url abs entier arrondi racine mod max min aleatoire type estnul vide date heure maintenant horodatage taille nbelements clefs valeurs aclef copier fixermetatable obtenirmetatable lirebrut ecrirebrut inserer retirer trier appeler json dejson requete valeursql hachage uuid fdf ddf numenr nbenr trouve alias champ enregistrement sisinon";
const rx = l => new RegExp("(?:" + l.split(" ").join("|") + ")(?![\\wÀ-ÿ])");
if (CM && CM.defineSimpleMode) {
  CM.defineSimpleMode("wdgfr", {
    start: [
      { regex: /(?:&&|\/\/).*/, token: "comment" },
      { regex: /\s*\*.*/, token: "comment", sol: true },
      { regex: /"(?:[^\\"]|\\.)*"?/, token: "string" },
      { regex: /'(?:[^\\']|\\.)*'?/, token: "string" },
      { regex: /\[\[/, token: "string", next: "longue" },
      { regex: /(procedure|fonction)(\s+)([\wÀ-ÿ]+)/, token: ["keyword", null, "def"] },
      { regex: /(:)(procedure)(\s+)([\wÀ-ÿ]+)/, token: ["operator", "keyword", null, "def"] },
      { regex: /\.(?:et|ou|non|v|f|t|vrai|faux|nul)\./i, token: "atom" },
      { regex: /(?:vrai|faux|nul)(?![\wÀ-ÿ])/, token: "atom" },
      { regex: rx(FONCS) , token: "builtin" },
      { regex: rx(MOTS), token: "keyword" },
      { regex: /__[\w]+/i, token: "variable-3" },
      { regex: /@[\wÀ-ÿ]+/, token: "variable-3" },
      { regex: /(?:SESSION|REQUETE|VALIDE|ACCEPTE)(?![\wÀ-ÿ])/i, token: "variable-2" },
      { regex: /\d+(?:\.\d+)?(?:e[+-]?\d+)?/i, token: "number" },
      { regex: /\?\??|->|\.\.|[-+*\/%^=<>#$:]+/, token: "operator" },
      { regex: /[\wÀ-ÿ]+/, token: "variable" }
    ],
    longue: [ { regex: /.*?\]\]/, token: "string", next: "start" }, { regex: /.*/, token: "string" } ],
    meta: { lineComment: "&&" }
  });
  CM.defineMode("wdgpage", config => CM.multiplexingMode(
    CM.getMode(config, "htmlmixed"),
    { open: "<%--", close: "--%>", mode: CM.getMode(config, "text/plain"), delimStyle: "comment", innerStyle: "comment" },
    { open: "<%", close: "%>", mode: CM.getMode(config, "wdgfr"), delimStyle: "tag-wdg" }
  ));
}

// éditeur (CodeMirror ou repli)
let editeur = null;
function creerEditeur() {
  const zone = $("#zone");
  if (CM) {
    const hote = document.createElement("div");
    hote.id = "hote"; hote.style.display = "none"; zone.appendChild(hote);
    editeur = CM(hote, {
      theme: "wdg", lineNumbers: true, indentUnit: 2, tabSize: 2, indentWithTabs: false, matchBrackets: true,
      autoCloseBrackets: true, styleActiveLine: true, lineWrapping: false,
      extraKeys: {
        "Ctrl-S": enregistrer, "Cmd-S": enregistrer, "Ctrl-/": "toggleComment", "Cmd-/": "toggleComment",
        "Tab": cm => cm.somethingSelected() ? cm.indentSelection("add") : cm.replaceSelection("  ", "end")
      }
    });
    editeur.on("change", () => { const o = ongletActif(); if (o && !o.binaire) { marquer(o, true); verifierDiffere(o); } });
  } else {
    const t = document.createElement("textarea");
    t.className = "repli"; t.id = "hote"; t.style.display = "none"; t.spellcheck = false; zone.appendChild(t);
    t.addEventListener("input", () => { const o = ongletActif(); if (o) { o.texte = t.value; marquer(o, true); verifierDiffere(o); } });
    journal("CodeMirror indisponible (pas d'accès au CDN) : éditeur simplifié.", "info");
  }
}
function montrer(id) {
  for (const el of $("#zone").children) el.style.display = el.id === id ? "" : "none";
  if (id === "hote" && editeur) editeur.refresh();
}

// API
async function api(action, params = {}, corps = undefined) {
  const url = "/EDIT/" + action + "?" + new URLSearchParams(params);
  const opts = { method: corps === undefined ? "GET" : "POST", headers: { "X-WDG": "1" }, credentials: "same-origin" };
  if (corps !== undefined) opts.body = corps;
  const r = await fetch(url, opts);
  let j = null;
  try { j = await r.json(); } catch (e) { }
  if (r.status === 403 && !j) { journal("Session expirée ou droits insuffisants : rechargez la page.", "err"); throw new Error("403"); }
  if (!r.ok) throw new Error((j && j.message) || ("HTTP " + r.status));
  return j;
}

// console
function journal(msg, cls = "info", cible = null) {
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = new Date().toLocaleTimeString("fr-FR") + "  " + msg;
  if (cible) d.onclick = () => allerA(cible.fichier, cible.ligne);
  const c = $("#console"); c.appendChild(d); c.scrollTop = c.scrollHeight;
}
function afficherErreurs(erreurs, contexte) {
  for (const o of etat.onglets) if (o.doc && o.marques) { o.marques.forEach(l => o.doc.removeLineClass(l, "background", "ligne-erreur")); o.marques = []; }
  if (!erreurs || !erreurs.length) { if (contexte) journal(contexte, "ok"); $("#etat").textContent = "✓ aucune erreur"; $("#etat").style.color = "var(--ok)"; return; }
  $("#etat").textContent = erreurs.length + " erreur(s)"; $("#etat").style.color = "var(--err)";
  for (const e of erreurs) {
    journal((e.fichier ? e.fichier + ":" + e.ligne + "  " : "") + e.message, "err", e);
    const o = etat.onglets.find(x => x.chemin === e.fichier);
    if (o && o.doc && e.ligne > 0) { const h = o.doc.addLineClass(e.ligne - 1, "background", "ligne-erreur"); o.marques = (o.marques || []).concat([h]); }
  }
}
async function allerA(fichier, ligne) {
  if (!fichier || !/^(PROG|PAGE|BLOB)\//.test(fichier)) return;
  await ouvrir(fichier);
  if (editeur && editeur.setCursor && ligne > 0) { editeur.setCursor({ line: ligne - 1, ch: 0 }); editeur.focus(); }
}

// arbre
async function chargerArbre() {
  const j = await api("arbre");
  etat.racines = j.racines;
  dessinerArbre();
}
function icone(chemin, dossier) {
  if (dossier) return ["▸", "dossier"];
  if (/\.prg$/i.test(chemin)) return ["ƒ", "prg"];
  if (chemin.startsWith("PAGE/")) return ["◇", "page"];
  if (/\.(png|jpe?g|gif|svg|webp|ico|avif)$/i.test(chemin)) return ["▣", ""];
  return ["·", ""];
}
function dessinerArbre() {
  const a = $("#arbre"); a.innerHTML = "";
  for (const r of etat.racines) {
    const bloc = document.createElement("div"); bloc.className = "racine";
    const t = document.createElement("div"); t.className = "racine-titre";
    t.innerHTML = `<span class="nom">${r.nom}</span>`;
    t.append(bouton("+", "Nouveau fichier", () => nouveauFichier(r.nom)),
             bouton("▤", "Nouveau dossier", () => nouveauDossier(r.nom)),
             bouton("⇪", "Téléverser des fichiers", () => televerser(r.nom)));
    bloc.appendChild(t);
    // regroupement par dossier.
    const elems = r.elements.slice().sort((x, y) => x.chemin.localeCompare(y.chemin, "fr"));
    for (const e of elems) {
      const parent = e.chemin.substring(0, e.chemin.lastIndexOf("/"));
      if (!estVisible(parent)) continue;
      const prof = e.chemin.split("/").length - 2;
      const l = document.createElement("div"); l.className = "ligne"; l.style.paddingLeft = (0.9 + prof * 0.9) + "rem";
      if (etat.actif === e.chemin) l.classList.add("actif");
      const [ic, cl] = icone(e.chemin, e.dossier);
      const ouvert = e.dossier && etat.ouverts.has(e.chemin);
      l.innerHTML = `<span class="ico ${cl}">${e.dossier ? (ouvert ? "▾" : "▸") : ic}</span><span class="nom"></span>`;
      l.querySelector(".nom").textContent = e.chemin.substring(e.chemin.lastIndexOf("/") + 1);
      l.title = e.dossier ? e.chemin : `${e.chemin}\n${e.taille} octets · ${e.modif}`;
      const act = document.createElement("span"); act.className = "actions";
      if (e.dossier) act.append(bouton("+", "Nouveau fichier ici", ev => { ev.stopPropagation(); nouveauFichier(e.chemin); }),
                                bouton("⇪", "Téléverser ici", ev => { ev.stopPropagation(); televerser(e.chemin); }));
      act.append(bouton("✎", "Renommer / déplacer", ev => { ev.stopPropagation(); renommer(e.chemin); }),
                 bouton("✕", "Supprimer", ev => { ev.stopPropagation(); supprimer(e.chemin, e.dossier); }));
      l.appendChild(act);
      l.onclick = () => {
        if (e.dossier) { etat.ouverts.has(e.chemin) ? etat.ouverts.delete(e.chemin) : etat.ouverts.add(e.chemin); dessinerArbre(); }
        else ouvrir(e.chemin);
      };
      bloc.appendChild(l);
    }
    a.appendChild(bloc);
  }
}
function estVisible(parent) {
  const p = parent.split("/");
  for (let i = 2; i <= p.length; i++) if (!etat.ouverts.has(p.slice(0, i).join("/"))) return false;
  return true;
}
function bouton(txt, titre, f) { const b = document.createElement("button"); b.textContent = txt; b.title = titre; b.onclick = f; return b; }

// onglets.
function ongletActif() { return etat.onglets.find(o => o.chemin === etat.actif) || null; }
function modePour(chemin) {
  if (/\.prg$/i.test(chemin)) return "wdgfr";
  if (chemin.startsWith("PAGE/")) return "wdgpage";
  if (/\.html?$/i.test(chemin)) return "htmlmixed";
  if (/\.css$/i.test(chemin)) return "css";
  if (/\.m?js$/i.test(chemin)) return "javascript";
  if (/\.json$/i.test(chemin)) return { name: "javascript", json: true };
  if (/\.(md|markdown)$/i.test(chemin)) return "markdown";
  if (/\.svg$/i.test(chemin)) return "xml";
  return "text/plain";
}
async function ouvrir(chemin) {
  let o = etat.onglets.find(x => x.chemin === chemin);
  if (!o) {
    if (/^BLOB\/.*\.(png|jpe?g|gif|webp|ico|avif|bmp)$/i.test(chemin)) {
      o = { chemin, image: true };
    } else {
      let j;
      try { j = await api("lire", { chemin }); } catch (e) { journal(e.message, "err"); return; }
      o = { chemin, binaire: j.binaire, taille: j.taille, propre: j.contenu, texte: j.contenu, sale: false };
      if (!j.binaire && CM) o.doc = CM.Doc(j.contenu, modePour(chemin));
    }
    etat.onglets.push(o);
  }
  activer(chemin);
}
function activer(chemin) {
  etat.actif = chemin;
  const o = ongletActif();
  dessinerOnglets(); dessinerArbre();
  const p = chemin.split("/");
  $("#fil").innerHTML = p.slice(0, -1).map(x => escapeHtml(x)).join(" / ") + " / <b>" + escapeHtml(p[p.length - 1]) + "</b>";
  if (!o) { montrer("accueil"); return; }
  if (o.image || o.binaire) {
    let ap = $("#apercu");
    if (!ap) { ap = document.createElement("div"); ap.id = "apercu"; $("#zone").appendChild(ap); }
    ap.innerHTML = "";
    if (o.image) { const img = document.createElement("img"); img.src = "/" + chemin.substring(5).split("/").map(encodeURIComponent).join("/") + "?t=" + Date.now(); ap.appendChild(img); }
    else { const d = document.createElement("div"); d.className = "info"; d.textContent = `Fichier binaire (${o.taille} octets) : non modifiable ici.`; ap.appendChild(d); }
    montrer("apercu");
  } else if (CM) {
    editeur.swapDoc(o.doc); montrer("hote"); editeur.focus();
  } else {
    const t = $("#hote"); t.value = o.texte; montrer("hote"); t.focus();
  }
  $("#btEnregistrer").disabled = !o || o.image || o.binaire || !o.sale;
}
function dessinerOnglets() {
  const z = $("#onglets"); z.innerHTML = "";
  for (const o of etat.onglets) {
    const d = document.createElement("div");
    d.className = "onglet" + (o.chemin === etat.actif ? " actif" : "") + (o.sale ? " sale" : "");
    d.title = o.chemin;
    const n = document.createElement("span"); n.textContent = o.chemin.substring(o.chemin.lastIndexOf("/") + 1);
    const f = document.createElement("button"); f.className = "fermer"; f.innerHTML = "<span>×</span>"; f.title = "Fermer";
    f.onclick = ev => { ev.stopPropagation(); fermer(o.chemin); };
    d.append(n, f); d.onclick = () => activer(o.chemin);
    z.appendChild(d);
  }
}
function fermer(chemin) {
  const o = etat.onglets.find(x => x.chemin === chemin);
  if (o && o.sale && !confirm("Fermer sans enregistrer " + chemin + " ?")) return;
  const i = etat.onglets.indexOf(o);
  etat.onglets.splice(i, 1);
  if (etat.actif === chemin) {
    const s = etat.onglets[Math.min(i, etat.onglets.length - 1)];
    if (s) activer(s.chemin); else { etat.actif = null; dessinerOnglets(); dessinerArbre(); $("#fil").textContent = "Aucun fichier ouvert"; montrer("accueil"); }
  } else dessinerOnglets();
}
function marquer(o, sale) {
  if (o.sale === sale) return;
  o.sale = sale; dessinerOnglets();
  if (o.chemin === etat.actif) $("#btEnregistrer").disabled = !sale;
}
function contenuDe(o) { return o.doc ? o.doc.getValue() : o.texte; }

// actions.
async function enregistrer() {
  const o = ongletActif();
  if (!o || o.image || o.binaire) return;
  try {
    const j = await api("ecrire", { chemin: o.chemin }, contenuDe(o));
    marquer(o, false);
    afficherErreurs(j.erreurs, o.chemin + " enregistré" + (o.chemin.startsWith("PROG/") ? " · procédures rechargées" : ""));
    chargerArbre();
  } catch (e) { journal("Échec de l'enregistrement : " + e.message, "err"); }
}
let minuteur = null;
function verifierDiffere(o) {
  if (!/^(PROG\/.*\.prg|PAGE\/.*)$/i.test(o.chemin)) return;
  clearTimeout(minuteur);
  minuteur = setTimeout(async () => {
    try {
      const j = await api("verifier", { chemin: o.chemin }, contenuDe(o));
      // affichage discret : on ne vide la console que pour les nouvelles erreurs.
      if (j.erreurs.length) afficherErreurs(j.erreurs);
      else { afficherErreurs([]); }
    } catch (e) { }
  }, 700);
}
const MODELES = {
  prg: n => `&& ${n}\nprocedure ${n.replace(/\.prg$/i, "").toUpperCase().replace(/[^A-Z0-9_]/g, "_")}\n  envoyer accueil avec titre = "Bonjour"\nretourner\n`,
  page: () => `<!doctype html>\n<html lang="fr">\n<head><meta charset="utf-8"><title><%= titre %></title></head>\n<body>\n  <h1><%= titre %></h1>\n</body>\n</html>\n`
};
async function nouveauFichier(dossier) {
  const nom = prompt("Nom du nouveau fichier dans " + dossier + " :", dossier.startsWith("PROG") ? "nouveau.prg" : dossier.startsWith("PAGE") ? "nouvelle.html" : "");
  if (!nom) return;
  const chemin = dossier + "/" + nom.replace(/^\/+/, "");
  if (etat.racines.some(r => r.elements.some(e => e.chemin === chemin))) { journal("Existe déjà : " + chemin, "err"); return; }
  const contenu = chemin.startsWith("PROG/") && /\.prg$/i.test(nom) ? MODELES.prg(nom) : chemin.startsWith("PAGE/") ? MODELES.page() : "";
  try {
    const j = await api("ecrire", { chemin }, contenu);
    afficherErreurs(j.erreurs, "Créé : " + chemin);
    dossier.split("/").reduce((acc, x) => { acc = acc ? acc + "/" + x : x; etat.ouverts.add(acc); return acc; }, "");
    await chargerArbre(); ouvrir(chemin);
  } catch (e) { journal(e.message, "err"); }
}
async function nouveauDossier(dossier) {
  const nom = prompt("Nom du nouveau dossier dans " + dossier + " :");
  if (!nom) return;
  try { await api("dossier", { chemin: dossier + "/" + nom }, ""); etat.ouverts.add(dossier); journal("Dossier créé : " + dossier + "/" + nom, "ok"); chargerArbre(); }
  catch (e) { journal(e.message, "err"); }
}
function televerser(dossier) { etat.dossierTel = dossier; $("#fichierTel").value = ""; $("#fichierTel").click(); }
$("#fichierTel").onchange = async ev => {
  for (const f of ev.target.files) {
    const chemin = etat.dossierTel + "/" + f.name;
    try {
      let ecraser = "0";
      if (etat.racines.some(r => r.elements.some(e => e.chemin === chemin))) {
        if (!confirm(chemin + " existe : remplacer ?")) continue;
        ecraser = "1";
      }
      const j = await api("televerser", { chemin, ecraser }, f);
      afficherErreurs(j.erreurs, "Téléversé : " + chemin + " (" + f.size + " octets)");
      const o = etat.onglets.find(x => x.chemin === chemin);
      if (o) { etat.onglets.splice(etat.onglets.indexOf(o), 1); }
    } catch (e) { journal(chemin + " : " + e.message, "err"); }
  }
  chargerArbre();
};
async function supprimer(chemin, dossier) {
  if (!confirm("Supprimer définitivement " + chemin + (dossier ? " et tout son contenu" : "") + " ?")) return;
  try {
    const j = await api("supprimer", { chemin }, "");
    for (const o of etat.onglets.slice()) if (o.chemin === chemin || o.chemin.startsWith(chemin + "/")) { o.sale = false; fermer(o.chemin); }
    afficherErreurs(j.erreurs, "Supprimé : " + chemin);
    chargerArbre();
  } catch (e) { journal(e.message, "err"); }
}
async function renommer(chemin) {
  const vers = prompt("Nouveau chemin (même dossier racine) :", chemin);
  if (!vers || vers === chemin) return;
  try {
    const j = await api("renommer", { de: chemin, vers }, "");
    for (const o of etat.onglets) if (o.chemin === chemin) o.chemin = vers;
    if (etat.actif === chemin) etat.actif = vers;
    afficherErreurs(j.erreurs, "Renommé : " + chemin + " → " + vers);
    await chargerArbre(); dessinerOnglets();
  } catch (e) { journal(e.message, "err"); }
}
$("#btEnregistrer").onclick = enregistrer;
$("#btRecharger").onclick = async () => {
  try { const j = await api("recharger", {}, ""); afficherErreurs(j.erreurs, j.procedures + " procédure(s) rechargée(s)"); }
  catch (e) { journal(e.message, "err"); }
};
document.addEventListener("keydown", e => { if (e.defaultPrevented) return; if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); enregistrer(); } });
window.addEventListener("beforeunload", e => { if (etat.onglets.some(o => o.sale)) { e.preventDefault(); e.returnValue = ""; } });
function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }

creerEditeur();
montrer("accueil");
chargerArbre().then(() => journal("Prêt.", "ok")).catch(e => journal(e.message, "err"));
</script>
</body>
